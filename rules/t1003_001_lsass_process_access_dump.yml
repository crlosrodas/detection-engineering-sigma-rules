title: LSASS Process Access With Memory-Dump Access Mask
id: e8bea732-94d9-42d1-9edd-fbf4d4f27873
status: experimental
description: |
    Detects a process opening a handle to lsass.exe (Sysmon EID 10 ProcessAccess) with a
    GrantedAccess mask that grants the read/clone rights used to dump LSASS memory
    (e.g. PROCESS_VM_READ | PROCESS_QUERY_INFORMATION). Covers the well-known dump masks used by
    tools such as comsvcs.dll MiniDump, Mimikatz and ProcDump. GrantedAccess is compared
    case-insensitively, so both upper- and lower-case hex representations are matched.
references:
    - https://raw.githubusercontent.com/OTRF/Security-Datasets/master/datasets/atomic/windows/credential_access/host/psh_lsass_memory_dump_comsvcs.zip
    - https://github.com/OTRF/Security-Datasets
author: Carlos Rodas
date: 2026-07-17
modified: 2026-07-17
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: process_access
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1FFFFF'
            - '0x1F3FFF'
            - '0x1F1FFF'
            - '0x1010'
            - '0x1410'
            - '0x143A'
    filter_main_azure_guest_agent:
        # Azure VM guest agent diagnostics collector; lives under a versioned
        # C:\WindowsAzure\GuestAgent_*\ path, so key on the basename only.
        SourceImage|endswith: '\CollectGuestLogs.exe'
    filter_main_windows_internals:
        # Windows internals opening lsass during normal operation. Anchored to
        # the System32 path (not a bare basename) so a payload named csrss.exe
        # in another directory is NOT excluded. Matching is case-insensitive.
        SourceImage|endswith:
            - ':\Windows\System32\wininit.exe'
            - ':\Windows\System32\csrss.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Azure VM guest agent 'CollectGuestLogs.exe' opening lsass with GrantedAccess 0x1410 during
      benign log collection (observed in testing; now filtered in the rule).
    - Windows internals 'wininit.exe' and 'csrss.exe' (System32) opening lsass with 0x1fffff during
      normal operation (observed in testing; now filtered in the rule).
    - Endpoint protection, EDR/antivirus agents, and some backup/monitoring products that
      legitimately open lsass with high-rights handles; baseline the expected SourceImage set and
      add them to the filter as needed.
level: high
